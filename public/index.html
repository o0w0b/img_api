<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>随机图 API</title>

    <style>
        :root {
            --bg: #ffffff;
            --text: #1f2937;
            --sub: #6b7280;
            --border: #e5e7eb;
            --card: #f9fafb;
            --accent: #2563eb;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --text: #e5e7eb;
            --sub: #94a3b8;
            --border: #1e293b;
            --card: #020617;
            --accent: #60a5fa;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background .2s, color .2s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.2rem;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(6px);
        }

        header h1 {
            margin: 0;
            font-size: 1.3rem;
        }

        .theme-btn {
            border: 1px solid var(--border);
            background: none;
            color: var(--text);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 1rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            transition: transform .2s ease, box-shadow .2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] .card:hover {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        h2 {
            margin-top: 0;
        }

        ul {
            padding-left: 1.2rem;
        }

        li {
            margin: 0.6rem 0;
            line-height: 1.6;
        }

        .api-link {
            font-family: monospace;
            color: var(--accent);
            text-decoration: none;
            word-break: break-all;
        }

        .api-link:hover {
            text-decoration: underline;
        }

        .desc {
            color: var(--sub);
            margin-left: 0.4rem;
        }

        /* 部署教程提示 */
        .deploy-tip {
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px dashed var(--border);
            text-align: center;
            font-size: 0.9rem;
            color: var(--sub);
        }

        .deploy-tip a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .deploy-tip a:hover {
            text-decoration: underline;
        }

        /* 预览区域 */
        .preview {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .preview-box {
            width: 100%;
            max-width: 480px;
            height: 300px;
            margin: 0.8rem auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .preview button {
            margin-top: 0.6rem;
            padding: 0.45rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.9rem;
            color: var(--sub);
        }

        footer a {
            color: var(--accent);
            text-decoration: none;
            opacity: .85;
        }

        footer a:hover {
            opacity: 1;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.1rem;
            }

            .preview-box {
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>随机图 API</h1>
        <button class="theme-btn" id="toggleTheme">🌓</button>
    </header>

    <main>
        <div class="card">
            <h2>接口说明</h2>
            <ul>
                <li>
                    <a class="api-link" href="/random" target="_blank">
                        https://api.o0w0b.top/random
                    </a>
                    <span class="desc">随机图片</span>
                </li>
                <li>
                    <a class="api-link" href="/cover" target="_blank">
                        https://api.o0w0b.top/cover
                    </a>
                    <span class="desc">封面图</span>
                </li>
                <li>
                    <a class="api-link" href="/background" target="_blank">
                        https://api.o0w0b.top/background
                    </a>
                    <span class="desc">背景图</span>
                </li>
            </ul>

            <div class="deploy-tip">
                想自己部署一个这样的 API？
                <a href="https://blog.o0w0b.top/posts/ac97dec/" target="_blank">
                    查看部署教程
                </a>
            </div>
        </div>

        <div class="card preview">
            <h2>实时预览</h2>
            <div class="preview-box">
                <img id="previewImg" src="/random" alt="随机图">
            </div>
            <button onclick="refresh()">换一张</button>
        </div>
    </main>

    <footer>
        <a href="https://github.com/o0w0b/img_api" target="_blank">
            Source Repository
        </a>
    </footer>

    <script>
        const root = document.documentElement;
        const btn = document.getElementById("toggleTheme");

        const saved = localStorage.getItem("theme");
        if (saved) {
            root.setAttribute("data-theme", saved);
        } else {
            const prefersDark = matchMedia("(prefers-color-scheme: dark)");
            root.setAttribute("data-theme", prefersDark.matches ? "dark" : "light");
            prefersDark.addEventListener("change", e => {
                root.setAttribute("data-theme", e.matches ? "dark" : "light");
            });
        }

        btn.onclick = () => {
            const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
            root.setAttribute("data-theme", next);
            localStorage.setItem("theme", next);
        };

        function refresh() {
            document.getElementById("previewImg").src = "/random?t=" + Date.now();
        }
    </script>

</body>

</html>
